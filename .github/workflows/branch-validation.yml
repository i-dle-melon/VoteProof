name: VoteProof Branch Validation
on:
  push:
    branches: ['codex/**']
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Optional exact SHA required by Production validation
        type: string
      full_regression:
        description: Run all tests and LOCAL migration checks
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: voteproof-validation-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.plan.outputs.migrations }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        run: node scripts/ci/plan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FULL_REGRESSION: ${{ inputs.full_regression }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: .wrangler/ci-plan.json
          include-hidden-files: true
          retention-days: 7
  backend:
    name: Affected backend and unit tests
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .wrangler
      - run: npm ci
      - run: node scripts/ci/run.mjs node
  browser:
    name: Browser (${{ matrix.project }})
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chrome
            browser: chrome
          - project: android-chrome
            browser: chrome
          - project: iphone-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .wrangler
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/ci/run.mjs browser ${{ matrix.project }}
  build-security:
    name: Builds, assets and Preview isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:frontend-hooks
      - run: npm run check:public-assets
      - run: node scripts/check-frontend-sensitive.mjs --tracked
      - run: node --test test/pages-public-build.test.js
      - name: Worker build only, no deployment
        run: npm run check
      - run: git diff --check
  migrations:
    name: LOCAL migration safety (only when affected or full requested)
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:admin-schema
      - run: node --test test/solo-target-registry-migration.test.js test/current-comeback-migration.test.js test/site-content-migration.test.js test/rc-migration-chain.test.js test/integration-production-schema.test.js
