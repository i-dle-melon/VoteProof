name: VoteProof UI Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voteproof-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:frontend-hooks
      - run: npm run check:public-assets
      - run: node scripts/check-frontend-sensitive.mjs --tracked
      - run: npm run build:pages-preview
      - run: node --test test/pages-public-build.test.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .wrangler/pages-preview
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
