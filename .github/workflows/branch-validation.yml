name: VoteProof Branch Validation
on:
  push:
    branches: [codex/campaign-admin-category-v1, codex/solo-total-leaderboard-fix]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voteproof-validation-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
jobs:
  backend:
    name: Backend, domain, security and frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Full tests including real Miniflare integration (no skips)
        run: npm test -- --test-concurrency=2
  browser:
    name: Full frontend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run test:frontend
  build-security:
    name: Builds, assets and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:frontend-hooks
      - run: npm run check:public-assets
      - run: node scripts/check-frontend-sensitive.mjs --tracked
      - run: npm run build:pages-preview
      - run: node --test test/pages-public-build.test.js
      - name: Worker build only (dry run, no deployment)
        run: npm run check
      - run: git diff --check
  migrations:
    name: Local D1 schema and populated 0018 to 0019 to 0020 to 0021 to 0022 safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Wrangler migrations and registry replay on disposable LOCAL D1
        run: npm run check:admin-schema
      - name: Populated 0018 migration and historical compatibility
        run: node --test test/solo-target-registry-migration.test.js test/current-comeback-migration.test.js test/site-content-migration.test.js test/rc-migration-chain.test.js test/integration-production-schema.test.js
