name: VoteProof Production Deploy
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "已看過 UI Preview 的完整 40 字元 main commit SHA"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: voteproof-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          printf 'Validated release commit: %s\n' "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reuse exact-SHA CI; await an existing run or request validation once
        run: node scripts/ci/validation.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Record public submission gate before deployment (read only)
        run: |
          mkdir -p .wrangler
          curl --fail --silent --show-error https://voteproof.i-dle-melon.workers.dev/api/submissions/status > .wrangler/gate-before.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('.wrangler/gate-before.json'));if(r.ok!==true||typeof r.data?.submissions_enabled!=='boolean')throw Error('Gate preflight failed');"
      - name: Deploy exact validated Worker once (no migrations or data changes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$(git status --porcelain)"
          # Preserve the approved Production ON / Preview OFF routing state.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.main = path.resolve(config.main);
          config.assets.directory = path.resolve(config.assets.directory);
          config.$schema = path.resolve(config.$schema);
          config.d1_databases.forEach(db => { db.migrations_dir = path.resolve(db.migrations_dir); });
          config.workers_dev = true;
          config.preview_urls = false;
          fs.mkdirSync('.wrangler', { recursive: true });
          fs.writeFileSync('.wrangler/approved-deploy.json', JSON.stringify(config));
          NODE
          npx wrangler deploy --name voteproof --config .wrangler/approved-deploy.json --keep-vars --message "Git commit $RELEASE_SHA"
          printf 'Deployed commit: %s\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'No migrations, data writes, or submission toggle performed.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify health and unchanged gate (read only)
        run: |
          curl --fail --silent --show-error https://voteproof.i-dle-melon.workers.dev/api/health > .wrangler/health-after.json
          curl --fail --silent --show-error https://voteproof.i-dle-melon.workers.dev/api/submissions/status > .wrangler/gate-after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=name=>JSON.parse(fs.readFileSync('.wrangler/'+name+'.json'));
          if(read('health-after').ok!==true)throw Error('Health check failed');
          const before=read('gate-before'),after=read('gate-after');
          if(after.ok!==true||JSON.stringify(before.data)!==JSON.stringify(after.data))throw Error('Submission gate changed; inspect without automatically retrying deployment');
          NODE
