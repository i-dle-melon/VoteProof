<aside id="ui-preview-banner" aria-label="UI 預覽情境">
  <strong>UI PREVIEW · 非正式網站</strong><span>全部是假資料；不登入、不連正式 API；互動只存於本頁記憶體。</span>
  <details id="preview-controls">
    <summary>切換預覽情境</summary>
    <div class="preview-controls-grid">
      <label>客服寄信<select data-preview-control="mail"><option value="success">模擬寄送成功</option><option value="rejected">確認未寄出・保留草稿</option><option value="ambiguous">寄送結果不明・禁止重送</option></select></label>
      <p class="tiny">會員查詢假資料：fan_yeh、preview_blocked_fan、preview_multi_fan、preview_no_email</p>
<label>彈窗公告<select data-preview-control="announcement"><option value="off">關閉</option><option value="on">開放，可關閉</option><option value="locked">開放，不可關閉</option><option value="future">尚未開始</option><option value="expired">已結束</option></select></label>
      <label>圖片匯出<select id="preview-exports" data-preview-control="exports"><option value="normal">Normal · 4386 張／14 包</option><option value="small">Small · 76 張／1 包</option><option value="empty">Empty · 0 張</option><option value="error">Error · 查詢失敗</option></select></label>
      <label
        >身份<select id="preview-identity" data-preview-control="identity">
          <option value="guest">訪客</option>
          <option value="member">一般會員（展示）</option>
          <option value="blocked">已封鎖會員（展示）</option>
          <option value="admin">Admin（展示）</option>
          <option value="super_admin">主管理員（展示）</option>
          <option value="reviewer">審核員（展示）</option>
        </select></label
      >
      <label
        >Submission Gate<select id="preview-gate" data-preview-control="gate">
          <option value="on">ON（只展示）</option>
          <option value="off">OFF</option>
        </select></label
      >
      <label
        >資料情境<select id="preview-data" data-preview-control="data">
          <option value="normal">Normal · 有資料</option>
          <option value="empty">Empty · 無資料</option>
          <option value="error">Error · 載入失敗</option>
        </select></label
      >
      <label
        >Theme<select id="preview-theme" data-preview-control="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select></label
      >
      <label
        >投稿畫面<select id="preview-submission" data-preview-control="submission">
          <option value="zero">0 張</option>
          <option value="multi">多張（3 張）</option>
          <option value="twenty">20 張</option>
          <option value="uploading">Uploading</option>
          <option value="success">Success</option>
          <option value="failed">Failed / Retry</option>
        </select></label
      >
      <label
        >Async 比對<select id="preview-analysis" data-preview-control="analysis">
          <option value="pending">pending</option>
          <option value="processing">processing</option>
          <option value="clear">clear</option>
          <option value="exact_duplicate">exact_duplicate</option>
          <option value="failed">failed</option>
        </select></label
      >
    <label>暱稱提示<select id="preview-nickname" data-preview-control="nickname"><option value="duplicate">Duplicate warning</option><option value="unique">Unique nickname</option></select></label><label>審核結果<select id="preview-review" data-preview-control="review"><option value="success">模擬成功</option><option value="error">API Error（保留展開）</option><option value="partial">Partial failure</option></select></label><label>儲存情境<select id="preview-storage" data-preview-control="storage"><option value="normal">正常</option><option value="high">90% 清理 dry-run</option><option value="stopped">95% 停止上傳</option><option value="recovered">容量恢復</option><option value="unknown">容量未知</option><option value="drive_error">Drive 額度錯誤</option><option value="cleanup_failed">清理驗證失敗</option></select></label></div>
  </details>
  <span id="preview-action-status" role="status"></span>
</aside>
