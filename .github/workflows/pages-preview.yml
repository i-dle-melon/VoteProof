name: VoteProof UI Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact commit SHA approved for this Pages-only publication
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: voteproof-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/solo-total-leaderboard-fix' || github.ref == 'refs/heads/codex/admin-member-mail-v1'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact manually approved Pages source
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:frontend-hooks
      - run: npm run check:public-assets
      - run: node scripts/check-frontend-sensitive.mjs --tracked
      - name: Build shared UI artifact and verify public-safe isolation
        run: node --test test/pages-public-build.test.js
      - run: npx playwright install --with-deps chrome
      - name: Quick Pages visual and isolation smoke
        run: npx playwright test frontend-tests/ci-smoke.spec.js --project=desktop-chrome --grep Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .wrangler/pages-preview
  deploy:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/solo-total-leaderboard-fix' || github.ref == 'refs/heads/codex/admin-member-mail-v1'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
